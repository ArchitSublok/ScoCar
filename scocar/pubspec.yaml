name: scocar
# ... your existing name/description/version lines ...

description: "SocCar  — Society Car & Delivery Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0

  # UI
  cupertino_icons: ^1.0.8
  animate_do: ^3.3.4
  url_launcher: ^6.3.0
  camera: ^0.11.0
  image: ^4.2.0

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.0.0

  # Notifications & HTTP
  flutter_local_notifications: ^18.0.1
  http: ^1.2.2
  path_provider: ^2.1.3
  path: ^1.9.0

# ─── assets go HERE, under flutter: at the BOTTOM ───
flutter:
  assets:
    - assets/sounds/beep.wav

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0



