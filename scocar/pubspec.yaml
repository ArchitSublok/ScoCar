name: scocar
description: "SocCar OS — Society Car & Delivery Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0

  # UI
  cupertino_icons: ^1.0.8
  animate_do: ^3.3.4
  url_launcher: ^6.3.0
  camera: ^0.11.0
  image: ^4.2.0

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Local Notifications (show push in foreground / background)
  flutter_local_notifications: ^18.0.1

  # HTTP — needed to call FCM API directly from the app
  # (in production, replace with Cloud Functions)
  http: ^1.2.2
  path_provider: ^2.1.3   # Locates secure temporary device directories to cache photos
  path: ^1.9.0 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
